<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我们的一周年 ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 背景音控件（隐藏默认样式，自定义开关） -->
    <audio id="bgm" src="assets/bg/bgm.mp3" loop preload="auto"></audio>
    <button id="bgmSwitch" class="bgm-switch">🎵 背景音：关闭</button>
    <!-- 开发者重置按钮（测试用，给女朋友看时可删除或注释） -->
    <button id="resetBtn" class="reset-btn">🔧 重置所有进度（测试用）</button>

    <!-- 1. 开场亲嘴页面（初始显示，完成后隐藏） -->
    <div id="introPage" class="page active">
        <div class="intro-title">贴贴打开我们的第一篇章完结篇 ❤️</div>
        <div class="intro-container">
            <!-- 左侧男生小人（可拖动/滑动） -->
            <div id="boy" class="character boy" draggable="false">
                <img src="assets/characters/boy_left.png" alt="男生">
            </div>
            <!-- 进度条 -->
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <!-- 右侧女生小人（固定） -->
            <div class="character girl">
                <img src="assets/characters/girl_right.png" alt="女生">
            </div>
        </div>
    </div>

    <!-- 2. 主页面（仅保留游戏入口，移除惊喜列表） -->
    <div id="mainPage" class="page">
        <div class="main-title">我们的一周年小游戏合集 ❤️</div>
        <div class="game-list">
            <!-- 游戏1：爱心收集（初始解锁，未通关可玩） -->
            <div id="game1Btn" class="game-btn" data-game="1">
                游戏1：收集小可爱
            </div>
            <!-- 游戏2：情侣拼图（初始锁定，游戏1通关后解锁） -->
            <div id="game2Btn" class="game-btn locked" data-game="2">
                游戏2：拼出大可爱
            </div>
            <!-- 游戏3：请重新攻略我（初始锁定，游戏2通关后解锁） -->
            <div id="game3Btn" class="game-btn locked" data-game="3">
                游戏3：请重新攻略我
            </div>
        </div>
    </div>

    <!-- 3. 游戏页面（所有游戏整合在这里，按需显示/隐藏） -->
    <div id="gamePage" class="page">
        <!-- 游戏1：爱心收集 -->
        <div id="game1" class="game-content">
            <div class="game-title"> ❤️ 收集满<span id="targetHearts">26</span>个一二通关</div>
            <div class="game-score">
                当前收集：<span id="currentHearts">0</span>颗 | 
                生命值：<span id="lifeCount">3</span> ❤️ | 
                <span id="game1Hint" style="color:#ff6b8b; margin-left:10px;">别点臭布布，只点一二宝</span>
            </div>
            <div id="imageContainer" class="image-container"></div>
            <button id="game1Quit" class="game-quit-btn">退出游戏</button>
        </div>

        <!-- 游戏2：情侣拼图（9宫格） -->
        <div id="game2" class="game-content hidden">
            <div class="game-title">拼出大可爱 ❤️ 拼回我们的合照吧</div>
            <div id="puzzleContainer" class="puzzle-container"></div>
            <button id="game2Quit" class="game-quit-btn">退出游戏</button>
        </div>

        <!-- 游戏3：请重新攻略我（恋爱视觉小说 - 纯好感度版） -->
        <div id="game3" class="game-content hidden">
            <div class="game-title">请重新攻略我 ❤️ 提升好感度通关</div>
            <div class="novel-container">
                <div class="avatar-container">
                    <img id="novelAvatar" src="assets/characters/boy_avatar.png" alt="头像">
                </div>
                <div id="novelDialogue" class="dialogue-box">Hello～还记得我们第一次约会去哪里了吗？</div>
                <div id="novelOptions" class="options-box"></div>
            </div>
            <div class="game-score">当前好感度：<span id="correctAnswers">0</span></div>
            <button id="game3Quit" class="game-quit-btn">退出游戏</button>
        </div>
    </div>

    <!-- 4. 惊喜页面（所有惊喜整合在这里，按需显示/隐藏，带防剧透） -->
    <div id="surprisePage" class="page">
        <!-- 惊喜1：语音告白（原来惊喜3） -->
        <div id="surprise1" class="surprise-content">
            <div class="surprise-title">专属语音告白 ❤️</div>
            <audio id="voiceAudio" src="assets/surprise/voice.mp3" controls preload="auto"></audio>
            <div class="surprise-desc">这是我想对你说的悄悄话～</div>
            <button id="surprise1Back" class="surprise-back-btn">听完返回游戏列表</button>
        </div>

        <!-- 惊喜2：合照相册 -->
        <div id="surprise2" class="surprise-content hidden">
            <div class="surprise-title">请你看个大可爱 ❤️</div>
            <div class="album-container">
                <img id="albumImg" src="assets/surprise/album/album_1.jpg" alt="合照">
                <button class="album-btn prev" onclick="changeAlbum(-1)">←</button>
                <button class="album-btn next" onclick="changeAlbum(1)">→</button>
            </div>
            <div class="surprise-desc">嘿嘿，本人小小处理一番，希望你喜欢～</div>
            <button id="surprise2Back" class="surprise-back-btn">看完返回游戏列表</button>
        </div>

        <!-- 惊喜3：恋爱日记（原来惊喜1） -->
        <div id="surprise3" class="surprise-content hidden">
            <div class="surprise-title">我的恋爱日记 ❤️</div>
            <div class="surprise-desc">这是我记录的我们这一年的点点滴滴～</div>
            <a id="diaryLink" href="#" target="_blank" class="surprise-btn big">点击查看恋爱日记</a>
            <button id="surprise3Back" class="surprise-back-btn">看完返回游戏列表</button>
        </div>
    </div>

    <!-- 5. 过场动画页面（通关时显示，短暂停留后隐藏） -->
    <div id="transitionPage" class="page transition hidden">
        <div class="transition-title">🎉 通关啦！</div>
        <div class="transition-desc">解锁了专属惊喜，正在为你跳转～</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
